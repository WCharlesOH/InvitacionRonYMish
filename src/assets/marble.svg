<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Lit stone surface → marble body -->
    <filter id="stone" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="5" seed="8" stitchTiles="stitch" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f2ebde" surfaceScale="1.7" diffuseConstant="1.15" result="lit">
        <feDistantLight azimuth="238" elevation="60"/>
      </feDiffuseLighting>
    </filter>
    <!-- Thin flowing veins -->
    <filter id="veins" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.007 0.011" numOctaves="4" seed="15" stitchTiles="stitch" result="v"/>
      <feColorMatrix in="v" type="matrix" values="0 0 0 0 0.44  0 0 0 0 0.40  0 0 0 0 0.32  0 0 0 5.5 -2"/>
    </filter>
  </defs>
  <!-- Warm ivory base -->
  <rect width="1000" height="1400" fill="#f1eade"/>
  <!-- Marble stone texture -->
  <rect width="1000" height="1400" filter="url(#stone)" opacity="0.9"/>
  <!-- Subtle taupe veins -->
  <rect width="1000" height="1400" filter="url(#veins)" opacity="0.3"/>
</svg>
